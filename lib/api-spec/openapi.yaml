        rejectedQuotations: { type: integer }
        upcomingAppointments: { type: integer }
        schedulingConflicts: { type: integer }
        conflictsDetected: { type: integer }
        atRiskCommitments: { type: integer }
      required: [enquiries, pendingQuotations, approvedQuotations, rejectedQuotations, upcomingAppointments, schedulingConflicts, conflictsDetected, atRiskCommitments]
    AttentionItem:
      type: object
