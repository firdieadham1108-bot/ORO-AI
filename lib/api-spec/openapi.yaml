openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ORO AI demo API (Phase 1 and 2) - staffing records, price list, enquiry analysis and quotations. All data is synthetic.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: oro
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /staff/availability:
    get:
      operationId: getStaffAvailability
      tags: [oro]
      summary: Staff availability for one date, calculated from capacity blocks
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      responses:
        "200":
          description: Availability of every staff member for the date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAvailabilityDay"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services:
    get:
      operationId: listServices
      tags: [oro]
      summary: Approved service price list
      responses:
        "200":
          description: Price list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
  /enquiries/analyse:
    post:
      operationId: analyseEnquiry
      tags: [oro]
      summary: Extract job details from a customer message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "200":
          description: Extracted details and anything still missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryAnalysis"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /enquiry:
    post:
      operationId: processEnquiry
      tags: [oro]
      summary: Read a customer message, calculate the price and check crew availability
      description: >
        One call that extracts the job details, calculates the price from the price list,
        checks the requested date against staff leave and job records, and suggests the
        next feasible dates when the requested date does not work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "200":
          description: Extracted details, price, availability verdict and alternatives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /enquiry/transcribe:
    post:
      operationId: transcribeVoiceNote
      tags: [oro]
      summary: Turn a voice note into editable enquiry text
      description: >
        Transcribes an uploaded or recorded audio file with OpenAI speech-to-text when a key is
        configured. Without a key (or for the built-in demo sample) it returns a clearly labelled
        "Simulated Demo Transcription". Browser speech-recognition results are passed through.
        Every call is logged as VOICE_TRANSCRIBED. The transcript is NOT analysed here: the web app
        puts it in the enquiry text box and then calls /enquiry, the same pipeline as typed text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionInput"
      responses:
        "200":
          description: Transcript text and how it was produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResult"
        "400":
          description: Invalid request (unknown sample, unsupported file type, file too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The speech-to-text service heard no words in the audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes:
    get:
      operationId: listQuotes
      tags: [oro]
      summary: List quotations, newest first
      responses:
        "200":
          description: Quotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [oro]
      summary: Create a draft quotation with a server-calculated price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Draft quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: Invalid or incomplete request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /approvals:
    post:
      operationId: approveQuotation
      tags: [oro]
      summary: Manager approves a quotation for a chosen appointment date
      description: >
        Re-checks the chosen date against the latest staff records. If the date is still
        feasible, saves an approved quotation with the crew and writes the approval to the
        activity log. Returns 409 if the date is not feasible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "201":
          description: Approved quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The demo role is not the manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The chosen date is not feasible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [oro]
      summary: Get one quotation for preview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}/schedule-options:
    get:
      operationId: getQuoteScheduleOptions
      tags: [oro]
      summary: Re-check a draft quotation's requested date and find alternatives (for manager approval)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Requested-date check and feasible alternatives, calculated from the latest records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteScheduleOptions"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}/approve:
    post:
      operationId: approveDraftQuotation
      tags: [oro]
      summary: Manager approves an existing draft quotation for a chosen appointment date
      description: >
        Same rules as POST /approvals, applied to a draft that sales staff sent for approval.
        Re-checks the date, reserves the crew and marks the draft approved. 409 if the date is
        not feasible or the quotation is no longer a draft.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftApprovalInput"
      responses:
        "200":
          description: Approved quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The demo role is not the manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The date is not feasible, or the quotation is not a draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quotes/{id}/reject:
    post:
      operationId: rejectDraftQuotation
      tags: [oro]
      summary: Manager declines a draft quotation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRejectionInput"
      responses:
        "200":
          description: Rejected quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The demo role is not the manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The quotation is not a draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [oro]
      summary: Dashboard counters, items that need attention and upcoming appointments
      responses:
        "200":
          description: Live counts calculated from the database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /staff/schedule:
    get:
      operationId: getStaffSchedule
      tags: [oro]
      summary: Week board - every technician's leave, jobs and ORO bookings per day
      parameters:
        - name: from
          in: query
          required: false
          description: First day of the board (YYYY-MM-DD). Defaults to the day after the demo reference date.
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: days
          in: query
          required: false
          description: Number of days (1-14, default 7)
          schema:
            type: integer
            minimum: 1
            maximum: 14
      responses:
        "200":
          description: Schedule board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSchedule"
        "400":
          description: Invalid date or range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orbyte-sim/emergency-leave:
    post:
      operationId: simulateEmergencyLeave
      tags: [oro]
      summary: Simulated Orbyte eLeave event - Bala's emergency leave on Monday 26 Oct 2026 is approved
      description: >
        Records the leave (never blocked), re-checks approved commitments that depend on Bala that day,
        marks them AT_RISK and recommends a replacement. Safe to call twice.
      responses:
        "200":
          description: Leave recorded and commitments re-checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveEventResult"
  /orbyte-sim/wallet:
    get:
      operationId: getOrbyteWallet
      tags: [oro]
      summary: Simulated Orbyte Credit Wallet (usage-based pricing demo, not real money)
      description: >
        Starts at 25.00 credits. Each manager approval of a quotation or of a recovery swap costs 0.10 credits
        and is recorded in the activity log. Reset Demo State restores 25.00.
      responses:
        "200":
          description: Current wallet balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrbyteWallet"
  /commitments:
    get:
      operationId: listCommitments
      tags: [oro]
      summary: Approved commitments with risk status and recommended recovery (at-risk first)
      responses:
        "200":
          description: Commitments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Commitment"
  /commitments/{id}/recover:
    post:
      operationId: recoverCommitment
      tags: [oro]
      summary: Manager approves the recommended crew swap for an at-risk commitment
      description: Re-validates the replacement inside a database transaction before changing the crew.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryInput"
      responses:
        "200":
          description: Commitment after recovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not at risk, or the replacement is no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /activity:
    get:
      operationId: listActivity
      tags: [oro]
      summary: Activity log, newest first
      responses:
        "200":
          description: Activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"
  /demo/reset:
    post:
      operationId: resetDemo
      tags: [oro]
      summary: Reset the synthetic demo data
      responses:
        "200":
          description: Demo data restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Service:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        specification: { type: ["string", "null"] }
        unitPrice: { type: number }
        unit: { type: string }
      required: [code, name, specification, unitPrice, unit]
    CapacityBlock:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [leave, assignment] }
        title: { type: string }
        startAt: { type: string }
        endAt: { type: string }
        reference: { type: string }
      required: [id, kind, title, startAt, endAt, reference]
    StaffAvailability:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        isSenior: { type: boolean }
        canInstall: { type: boolean }
        status:
          type: string
          enum: [available, on_leave, assigned, not_a_technician]
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/CapacityBlock"
      required: [id, name, role, isSenior, canInstall, status, blocks]
    StaffAvailabilityDay:
      type: object
      properties:
        date: { type: string }
        weekday: { type: string }
        windowStart: { type: string }
        windowEnd: { type: string }
        staff:
          type: array
          items:
            $ref: "#/components/schemas/StaffAvailability"
        availableInstallers: { type: integer }
        availableSeniorInstallers: { type: integer }
      required: [date, weekday, windowStart, windowEnd, staff, availableInstallers, availableSeniorInstallers]
    EnquiryInput:
      type: object
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
      required: [message]
    TranscriptionInput:
      type: object
      properties:
        source: { type: string, enum: [sample, upload, recording, browser_speech] }
        sampleId: { type: string, maxLength: 80 }
        fileName: { type: string, maxLength: 200 }
        mimeType: { type: string, maxLength: 100 }
        audioBase64: { type: string, maxLength: 14000000 }
        transcript: { type: string, maxLength: 2000 }
        durationSeconds: { type: number, minimum: 0, maximum: 3600 }
      required: [source]
    TranscriptionResult:
      type: object
      properties:
        transcript: { type: string }
        mode: { type: string, enum: [openai, simulated, browser] }
        label: { type: string }
        provider: { type: string }
        source: { type: string, enum: [sample, upload, recording, browser_speech] }
        fileName: { type: ["string", "null"] }
        sampleId: { type: ["string", "null"] }
        durationSeconds: { type: ["number", "null"] }
        note: { type: string }
      required: [transcript, mode, label, provider, source, fileName, sampleId, durationSeconds, note]
    EnquiryAnalysis:
      type: object
      properties:
        serviceCode: { type: ["string", "null"] }
        quantity: { type: ["integer", "null"] }
        specification: { type: ["string", "null"] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ParsedItem"
        requestedDate: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        referenceDate: { type: string }
        missing:
          type: array
          items: { type: string }
        clarification: { type: ["string", "null"] }
      required: [serviceCode, quantity, specification, items, requestedDate, location, referenceDate, missing, clarification]
    ParsedItem:
      type: object
      properties:
        serviceCode: { type: ["string", "null"] }
        serviceKind: { type: string, enum: [install, standard_service, chemical_wash] }
        quantity: { type: ["integer", "null"] }
        specification: { type: ["string", "null"] }
        issue: { type: ["string", "null"] }
      required: [serviceCode, serviceKind, quantity, specification, issue]
    PricingLine:
      type: object
      properties:
        serviceCode: { type: string }
        serviceName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
      required: [serviceCode, serviceName, quantity, unitPrice, lineTotal]
    Pricing:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PricingLine"
        serviceCode: { type: string }
        serviceName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        totalPrice: { type: number }
        totalFormatted: { type: string }
      required: [lines, serviceCode, serviceName, quantity, unitPrice, totalPrice, totalFormatted]
    CrewRequirement:
      type: object
      properties:
        crewSize: { type: integer }
        minSeniors: { type: integer }
        windowHours: { type: integer }
      required: [crewSize, minSeniors, windowHours]
    CrewMember:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        isSenior: { type: boolean }
      required: [id, name, role, isSenior]
    CapacityConflict:
      type: object
      properties:
        staffId: { type: integer }
        staffName: { type: string }
        kind: { type: string, enum: [leave, assignment] }
        title: { type: string }
        reference: { type: string }
        startAt: { type: string }
        endAt: { type: string }
        description: { type: string }
      required: [staffId, staffName, kind, title, reference, startAt, endAt, description]
    ScheduleCheck:
      type: object
      properties:
        date: { type: string }
        weekday: { type: string }
        verdict: { type: string, enum: [feasible, not_feasible, needs_verification] }
        workingDay: { type: boolean }
        windowStart: { type: string }
        windowEnd: { type: string }
        requirement:
          $ref: "#/components/schemas/CrewRequirement"
        availableInstallers: { type: integer }
        availableSeniorInstallers: { type: integer }
        crew:
          type: array
          items:
            $ref: "#/components/schemas/CrewMember"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/CapacityConflict"
        reasons:
          type: array
          items: { type: string }
        explanation: { type: string }
      required: [date, weekday, verdict, workingDay, windowStart, windowEnd, requirement, availableInstallers, availableSeniorInstallers, crew, conflicts, reasons, explanation]
    EnquiryResult:
      type: object
      properties:
        status: { type: string, enum: [needs_clarification, feasible, conflict, needs_verification] }
        summary: { type: string }
        analysis:
          $ref: "#/components/schemas/EnquiryAnalysis"
        pricing:
          $ref: "#/components/schemas/Pricing"
        requestedSchedule:
          $ref: "#/components/schemas/ScheduleCheck"
        recommendedDate: { type: string }
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleCheck"
      required: [status, summary, analysis, alternatives]
    QuoteInput:
      type: object
      properties:
        customerName: { type: string, minLength: 1, maxLength: 160 }
        serviceCode: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 500 }
        requestedDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        location: { type: string, minLength: 1, maxLength: 240 }
        message: { type: ["string", "null"], maxLength: 2000 }
        extraItems:
          type: ["array", "null"]
          maxItems: 5
          items:
            type: object
            properties:
              serviceCode: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 500 }
            required: [serviceCode, quantity]
        requestedBy: { type: ["string", "null"], maxLength: 80 }
      required: [customerName, serviceCode, quantity, requestedDate, location]
    DraftApprovalInput:
      type: object
      properties:
        appointmentDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        approverName: { type: ["string", "null"], maxLength: 80 }
      required: [appointmentDate]
    DraftRejectionInput:
      type: object
      properties:
        reason: { type: ["string", "null"], maxLength: 400 }
        managerName: { type: ["string", "null"], maxLength: 80 }
      required: []
    QuoteScheduleOptions:
      type: object
      properties:
        quote:
          $ref: "#/components/schemas/Quote"
        requested:
          $ref: "#/components/schemas/ScheduleCheck"
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleCheck"
      required: [quote, requested, alternatives]
    ApprovalInput:
      type: object
      properties:
        customerName: { type: string, minLength: 1, maxLength: 160 }
        serviceCode: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 500 }
        requestedDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        appointmentDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        location: { type: string, minLength: 1, maxLength: 240 }
        message: { type: ["string", "null"], maxLength: 2000 }
        extraItems:
          type: ["array", "null"]
          maxItems: 5
          items:
            type: object
            properties:
              serviceCode: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 500 }
            required: [serviceCode, quantity]
        approverName: { type: ["string", "null"], maxLength: 80 }
      required: [customerName, serviceCode, quantity, requestedDate, appointmentDate, location]
    Quote:
      type: object
      properties:
        id: { type: integer }
        reference: { type: string }
        companyName: { type: string }
        customerName: { type: string }
        location: { type: string }
        serviceCode: { type: string }
        serviceName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        totalPrice: { type: number }
        requestedDate: { type: string }
        appointmentDate: { type: ["string", "null"] }
        status: { type: string, enum: [draft, approved, rejected] }
        approvedBy: { type: ["string", "null"] }
        approvedAt: { type: ["string", "null"] }
        rejectionReason: { type: ["string", "null"] }
        createdBy: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
        crew:
          type: array
          items: { type: string }
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/PricingLine"
        riskStatus: { type: ["string", "null"], enum: [FEASIBLE, AT_RISK, null] }
        riskReason: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, reference, companyName, customerName, location, serviceCode, serviceName, quantity, unitPrice, totalPrice, requestedDate, appointmentDate, status, approvedBy, approvedAt, rejectionReason, createdBy, message, crew, lineItems, riskStatus, riskReason, createdAt]
    RejectedCandidate:
      type: object
      properties:
        staffName: { type: string }
        reason: { type: string }
      required: [staffName, reason]
    RecoveryPlan:
      type: object
      properties:
        status: { type: string, enum: [replacement_found, no_replacement] }
        unavailableStaffName: { type: string }
        unavailableStaffId: { type: integer }
        leaveReference: { type: string }
        replacement:
          oneOf:
            - $ref: "#/components/schemas/CrewMember"
            - type: "null"
        availableHours: { type: number }
        extraCost: { type: number }
        extraCostFormatted: { type: string }
        otherJobsDelayed: { type: integer }
        summary: { type: string }
        otherEligible:
          type: array
          items:
            $ref: "#/components/schemas/CrewMember"
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/RejectedCandidate"
        riskReason: { type: string }
      required: [status, unavailableStaffName, unavailableStaffId, leaveReference, replacement, availableHours, extraCost, extraCostFormatted, otherJobsDelayed, summary, otherEligible, rejected, riskReason]
    Commitment:
      type: object
      properties:
        quote:
          $ref: "#/components/schemas/Quote"
        recovery:
          oneOf:
            - $ref: "#/components/schemas/RecoveryPlan"
            - type: "null"
      required: [quote, recovery]
    RecoveryInput:
      type: object
      properties:
        managerName: { type: string, minLength: 1, maxLength: 80 }
        replacementStaffId: { type: ["integer", "null"] }
      required: [managerName]
    LeaveEventInfo:
      type: object
      properties:
        staffName: { type: string }
