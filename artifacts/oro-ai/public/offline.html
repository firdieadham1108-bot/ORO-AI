<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="theme-color" content="#0F1E33" />
  <title>ORO AI - Offline</title>
  <style>

  </style>

<body>
  <main>
    <img src="icons/oro-logo.png" width="96" height="96" style="border-radius:24px" alt="ORO AI penguin logo" />
